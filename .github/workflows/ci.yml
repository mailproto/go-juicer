name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: testdata/oracle/package-lock.json
      - run: go vet ./...
      - run: go test -race ./...
      # Verified, never regenerated: regenerating here would let a juice patch
      # release silently change our expectations with nobody reviewing it.
      - name: goldens match pinned juice
        run: make goldens-verify

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzCSS, FuzzDocument]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      # A smoke run on every change; the nightly run digs deeper.
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime ${{ github.event_name == 'schedule' && '5m' || '30s' }} .
      # Commit a failing input under testdata/fuzz so it replays as a regression test.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-crashers
          path: testdata/fuzz

  # Generated documents against juice, with a fresh seed each night. A small
  # run on every change keeps the harness itself from rotting.
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: testdata/oracle/package-lock.json
      - name: differential against juice
        env:
          JUICER_DIFFERENTIAL_DUMP: ${{ runner.temp }}/mismatches.jsonl
        run: make differential SEED=${{ github.run_id }} COUNT=${{ github.event_name == 'schedule' && '50000' || '2000' }}
      # Each line is a minimized document with both outputs; add it as a fixture.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-mismatches
          path: ${{ runner.temp }}/mismatches.jsonl

  # Advisory only: shared runners are too noisy for timing to fail a build.
  # TestAllocBudget in the test job is the hard gate.
  bench:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: testdata/oracle/package-lock.json
      - name: change against base
        if: github.event_name == 'pull_request'
        run: |
          {
            echo '### Benchmarks: base vs this change (advisory)'
            echo '```'
            make -s bench-compare BASE=${{ github.event.pull_request.base.sha }}
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: this package against juice
        if: github.event_name == 'push'
        run: |
          {
            echo '### Benchmarks: this package against juice'
            make -s bench-report
          } >> "$GITHUB_STEP_SUMMARY"
